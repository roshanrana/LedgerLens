[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerlens"
version = "0.2.0"
description = "AI-assisted, audit-ready financial reconciliation: deterministic-first matching, a LangGraph review gate, masked LLM adjudication, and an MCP review server."
requires-python = ">=3.11"
authors = [{ name = "LedgerLens" }]
dependencies = [
  "langgraph>=1.2",
  "langgraph-checkpoint-sqlite>=3.0",
  "mcp>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.18"]
bedrock = ["boto3>=1.34"]
anthropic = ["anthropic>=0.40"]

[project.scripts]
ledgerlens = "ledgerlens.cli:main"

[tool.setuptools.packages.find]
include = ["ledgerlens*"]

