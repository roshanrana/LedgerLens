services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.9
    profiles:
      - streaming
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy: *true'"]
      interval: 10s
      timeout: 5s
      retries: 12

  match-worker:
    build:
      context: ./go/match-worker
    profiles:
      - streaming
    depends_on:
      redpanda:
        condition: service_healthy
    command:
      - --mode
      - kafka
      - --brokers
      - redpanda:9092
      - --group
      - ledgerlens-match-worker
      - --input-topic
      - ledgerlens.transaction.normalized
      - --output-topic
      - ledgerlens.match.candidate_created
