name: ci

on:
  pull_request:
  push:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests

  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: make golden
      - run: python -m unittest tests.golden.test_headline_metrics
      - run: git diff --exit-code -- metrics/headline.json
      - run: python metrics/render.py --check

  go-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: go/match-worker/go.sum
      - run: go test ./...
        working-directory: go/match-worker
        env:
          GOWORK: off

  docker-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ledgerlens-match-worker:ci ./go/match-worker
      - run: docker compose --profile streaming config
